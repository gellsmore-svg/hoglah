name: Nightly integration
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
      rabbitmq:
        image: rabbitmq:3-management
        ports: ["5672:5672"]
      redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
        ports: ["9092:9092"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,cli,mongo,redis,rabbitmq,kafka,web]"
      - run: pytest -q
        env:
          RUN_MONGO_TESTS: "1"
          RUN_REDIS_TESTS: "1"
          RUN_RABBITMQ_TESTS: "1"
          RUN_KAFKA_TESTS: "1"
          HOGLAH_MONGO_URI: mongodb://localhost:27017
          HOGLAH_REDIS_URL: redis://localhost:6379/0
          HOGLAH_RABBITMQ_URL: amqp://guest:guest@localhost:5672/
