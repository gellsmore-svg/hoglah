name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    # GHA service containers do not support a custom `command` key (that made
    # the 0.10.4 workflow invalid). Use stock images only; Kafka/Redpanda stay
    # on the fake-transport unit tests + optional local RUN_KAFKA_TESTS.
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
      rabbitmq:
        image: rabbitmq:3
        ports: ["5672:5672"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies (including dev + transport extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cli,mongo,redis,rabbitmq,kafka,web]"

      - name: Lint with ruff
        run: |
          ruff check src tests

      - name: Wait for service ports
        run: |
          python - <<'PY'
          import socket, time, sys
          for name, port in (("mongo", 27017), ("redis", 6379), ("rabbitmq", 5672)):
              for _ in range(60):
                  try:
                      s = socket.create_connection(("127.0.0.1", port), 1)
                      s.close()
                      print(f"ok {name}:{port}")
                      break
                  except OSError:
                      time.sleep(1)
              else:
                  sys.exit(f"service not up: {name}:{port}")
          PY

      - name: Run unit + integration tests (Mongo/Redis/RabbitMQ)
        env:
          RUN_MONGO_TESTS: "1"
          RUN_REDIS_TESTS: "1"
          RUN_RABBITMQ_TESTS: "1"
          HOGLAH_MONGO_URI: mongodb://localhost:27017
          HOGLAH_REDIS_URL: redis://localhost:6379/0
        run: |
          pytest -q --tb=short

      - name: Build sdist and wheel (packaging check)
        run: |
          pip install build
          python -m build --sdist --wheel --outdir dist
          ls -l dist/

      - name: Smoke test CLI
        run: |
          hoglah --version
          hoglah --help
          hoglah ps --limit 1 || true
