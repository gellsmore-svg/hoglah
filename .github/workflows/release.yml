name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # required for PyPI trusted publishing

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist, wheel, and Windows portable zip
        run: |
          python -m build --sdist --wheel --outdir dist
          shopt -s nullglob
          wheels=(dist/hoglah-*-py3-none-any.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "expected exactly one wheel, got ${#wheels[@]}" >&2
            ls -l dist || true
            exit 1
          fi
          bash scripts/build-windows-portable.sh "${wheels[0]}" dist-win

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist-win/*.zip
          draft: false
          prerelease: false

      - name: Publish to PyPI (using trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No token needed if Trusted Publisher is configured on PyPI for this repo + tag
        # The workflow will fail gracefully if not yet configured (you can make it optional)
